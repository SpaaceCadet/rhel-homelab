name: Documentation and Compose validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Validate YAML and relative Markdown links
        run: python scripts/validate_docs.py
      - name: Check example Compose files
        shell: bash
        run: |
          set -euo pipefail
          for dir in stremio nextcloud dns monitoring; do
            if [ -f "$dir/.env.example" ]; then
              cp "$dir/.env.example" "$dir/.env"
            fi
            docker compose --project-directory "$dir" -f "$dir/compose.yaml" config --quiet
            rm -f "$dir/.env"
          done
      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
