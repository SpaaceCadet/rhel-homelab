# Example topology, NOT the exact production Compose.
# Pin compatible release tags/digests before deployment.
# Loopback host bindings reduce exposure; review firewall and trusted proxy access.
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    # Historical deployment did not mount host root.
    # For full filesystem visibility, follow node_exporter docs and test labels.

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    # Minimal sample: host-runtime mounts intentionally OMITTED.
    # Complete per-container visibility requires additional privileged mounts
    # and perhaps security-opt settings; see operations.md.

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter
    restart: unless-stopped
    command:
      - "--nginx.scrape-uri=http://host.docker.internal:8082/nginx_status"
    ports:
      - "127.0.0.1:9113:9113"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  grafana_data:
  prometheus_data:
