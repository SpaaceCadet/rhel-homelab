# Example ONLY. Replace tags with supported pinned releases after compatibility testing.
# Copy .env.example to .env, choose unique passwords, and never commit .env.
services:
  db:
    image: mariadb:10.6 # historical source tag; review support and pin a maintained tested tag
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set in .env}
      MARIADB_DATABASE: nextcloud
      MARIADB_USER: nextcloud
      MARIADB_PASSWORD: ${DB_APP_PASSWORD:?Set in .env}
    volumes:
      - ./data/db:/var/lib/mysql:Z
    networks: [backend]

  app:
    image: nextcloud:apache # example tag; pin a tested release
    restart: unless-stopped
    depends_on: [db]
    ports:
      - "127.0.0.1:8080:80"
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${DB_APP_PASSWORD:?Set in .env}
    volumes:
      - ./data/nextcloud:/var/www/html:Z
    networks: [backend]

networks:
  backend:
    driver: bridge
